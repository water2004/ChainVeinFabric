name: Publish verified ChainVein 4.1.2 mapped build
on:
  push:
    branches: ["dory/1.21.10"]
    paths: [".github/workflows/publish-mapped-4.1.2.yml"]
permissions:
  contents: write
concurrency:
  group: publish-mapped-chainvein-4.1.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ec8e068268dad14db4184c7c78e4bdefba3fd711
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build pinned tested source and run unit checks
        run: |
          chmod +x gradlew
          ./gradlew remapJar test --no-daemon --stacktrace
      - name: Verify content and append the canonical artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,urllib.request,urllib.parse,zipfile
          from pathlib import Path
          base="https://api.github.com/repos/water2004/ChainVeinFabric"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def api(path,data=None,method=None):
              req=urllib.request.Request(base+path,data=None if data is None else json.dumps(data).encode(),headers=headers,method=method or ("GET" if data is None else "PATCH"))
              with urllib.request.urlopen(req,timeout=90) as response:return json.load(response)
          def fingerprint(path):
              with zipfile.ZipFile(path) as archive:
                  rows=[]
                  for name in sorted(n for n in archive.namelist() if not n.endswith("/")):
                      data=archive.read(name)
                      if name=="META-INF/MANIFEST.MF":
                          data=("\n".join(sorted(line for line in data.decode().splitlines() if line))+"\n").encode()
                      rows.append(name+"\0"+hashlib.sha256(data).hexdigest())
                  return hashlib.sha256("\n".join(rows).encode()).hexdigest()
          jars=[p for p in Path("build/libs").glob("*.jar") if not any(part in p.name for part in ["-sources","-dev","audit","smoke"])]
          assert len(jars)==1,jars
          path=jars[0]
          assert fingerprint(path)=="95ab3f71322f2ef05179a45e0ddccb5369f328f671c359852cd2c7bc4db19a5d", "Build differs from clean rebuilt and client-tested production"
          name="ChainVeinFabric-4.1.2+1.21.10.jar"
          release=api("/releases/411959495")
          assert release["tag_name"]=="v4.1.2" and not release["draft"]
          data=path.read_bytes()
          digest="sha256:"+hashlib.sha256(data).hexdigest()
          existing={a["name"]:a for a in release["assets"]}
          if name in existing:
              assert existing[name].get("digest")==digest, "Existing asset differs; no overwrite permitted"
          else:
              url=release["upload_url"].split("{",1)[0]+"?"+urllib.parse.urlencode({"name":name})
              request=urllib.request.Request(url,data=data,headers={**headers,"Content-Type":"application/java-archive"},method="POST")
              with urllib.request.urlopen(request,timeout=120) as response:asset=json.load(response)
              assert asset["name"]==name and asset.get("digest")==digest
              print(asset["browser_download_url"])
          release=api("/releases/411959495")
          marker="<!-- mapped-chainvein-4.1.2 -->"
          body=release.get("body") or ""
          note="## Minecraft 1.21.10 download\n\n- Fabric / Java 21: `ChainVeinFabric-4.1.2+1.21.10.jar`\n- Uses this Minecraft version's GLFW primary-button convention.\n- The matching Printer client checks all seven AUTO/Ctrl-click transitions through the real mouse handler. Unit, standalone server, direct and forced-legacy integration checks were also run.\n"
          if marker not in body:api("/releases/411959495",{"body":body.rstrip()+"\n\n"+marker+"\n"+note})
          PY
