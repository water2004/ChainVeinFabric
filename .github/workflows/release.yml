name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
      - "[0-9]*.*.*"
      - "[0-9]*.*.*-*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish jars
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build and run server tests
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon

      - name: Run server game tests
        run: ./gradlew runGameTest --no-daemon

      - name: Run client game tests
        run: xvfb-run -a ./gradlew runClientGameTest --no-daemon

      - name: Test pure-client vanilla packet fallback
        run: >-
          xvfb-run -a ./gradlew runClientGameTest --no-daemon
          -PchainveinGameTestServerInstalled=false

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.ref_name }}
          path: |
            build/reports/tests/
            build/test-results/
            build/run/gameTest/logs/
            build/run/clientGameTest/logs/
          if-no-files-found: ignore

      - name: Collect jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No jars were produced in build/libs" >&2
            exit 1
          fi
          cp "${jars[@]}" release/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$TAG_NAME"
          if [[ "$TAG_NAME" =~ ^(.+)-([0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
            release_tag="${BASH_REMATCH[1]}"
          fi
          release_version="${release_tag#v}"
          prerelease=false
          if [[ "$release_version" == *-* ]]; then
            prerelease=true
          fi
          title="ChainVeinFabric ${release_version}"
          notes_file="RELEASE_NOTE.md"
          mapfile -t files < <(find release -type f -name '*.jar' | sort)

          if [ "$TAG_NAME" = "$release_tag" ]; then
            if gh release view "$release_tag" >/dev/null 2>&1; then
              if [ "$prerelease" = true ]; then
                gh release edit "$release_tag" --title "$title" --notes-file "$notes_file" --prerelease
              else
                gh release edit "$release_tag" --title "$title" --notes-file "$notes_file" --latest
              fi
              gh release upload "$release_tag" "${files[@]}" --clobber
            else
              release_args=(--title "$title" --notes-file "$notes_file")
              if [ "$prerelease" = true ]; then
                release_args+=(--prerelease --latest=false)
              else
                release_args+=(--latest)
              fi
              gh release create "$release_tag" "${files[@]}" --verify-tag "${release_args[@]}"
            fi
          else
            if [ "$prerelease" = true ]; then
              gh release edit "$release_tag" --title "$title" --notes-file "$notes_file" --prerelease
            else
              gh release edit "$release_tag" --title "$title" --notes-file "$notes_file" --latest
            fi
            gh release upload "$release_tag" "${files[@]}" --clobber
          fi
