name: Rehome ChainVein minimum versions to 4.1.0
on:
  push:
    branches: ['dory/1.21.11']
    paths: ['.github/republish-1.1.3/rehome-config.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the fixed, verified 36-file candidate
        uses: actions/download-artifact@v4
        with:
          repository: water2004/litematica-printer
          run-id: 40684303397
          artifact-ids: '12813538530'
          github-token: ${{ github.token }}
          path: minimum-release-files
          merge-multiple: true
      - name: Rehome only the two owned assets after public-copy verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/republish-1.1.3/rehome-chain.py
      - name: Retain preservation and public-download verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rehome-chain-publication-${{ github.sha }}
          path: .ci/rehome-chain/
          if-no-files-found: warn
