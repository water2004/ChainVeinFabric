name: Test

on:
  push:
    branches:
      - master
      - "1.21.1"
      - "dory/1.21.9"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Minecraft 1.21.9 build and server tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build, unit tests, and standalone server GameTests
        run: |
          chmod +x ./gradlew
          ./gradlew clean build runGameTest --no-daemon

      - name: Check out matching Quick Shulker source
        uses: actions/checkout@v4
        with:
          repository: water2004/quickshulker
          ref: dory/1.21.9
          path: .ci/quickshulker

      - name: Build matching Quick Shulker
        run: |
          chmod +x .ci/quickshulker/gradlew
          .ci/quickshulker/gradlew -p .ci/quickshulker build --no-daemon

      - name: Verify direct and forced legacy integration
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find .ci/quickshulker/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar')
          test "${#jars[@]}" -eq 1
          jar="$(realpath "${jars[0]}")"
          ./gradlew runGameTest -PquickshulkerJar="$jar" -PquickshulkerGameTestMode=new --no-daemon
          ./gradlew runGameTest -PquickshulkerJar="$jar" -PquickshulkerGameTestMode=new-legacy --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/run/gameTest/logs/
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
