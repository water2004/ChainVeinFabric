name: Test

on:
  push:
    branches:
      - master
      - "26.1"
      - "26.2"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Unit, server, and client game tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Install headless OpenGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dri libglx-mesa0 mesa-utils
          xvfb-run -a glxinfo -B

      - name: Build and run server tests
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon

      - name: Test Quick Shulker release API
        run: ./gradlew runGameTest --no-daemon -PquickshulkerGameTestMode=new

      - name: Test Quick Shulker legacy adapter
        run: ./gradlew runGameTest --no-daemon -PquickshulkerGameTestMode=new-legacy

      - name: Run client game tests
        timeout-minutes: 15
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: ./gradlew runProductionClientGameTest --no-daemon

      - name: Test pure-client vanilla packet fallback
        timeout-minutes: 15
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: >-
          ./gradlew runProductionClientGameTest --no-daemon
          -PquickshulkerGameTestMode=new
          -PchainveinGameTestServerInstalled=false

      - name: Upload test reports on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/run/gameTest/logs/
            build/run/clientGameTest/logs/
            run/logs/
            run/crash-reports/
            run/screenshots/
          if-no-files-found: ignore
