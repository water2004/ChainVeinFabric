name: Test

on:
  push:
    branches:
      - master
      - "26.1"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Unit, server, and client game tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build and run server tests
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon

      - name: Run client game tests
        run: xvfb-run -a ./gradlew runClientGameTest --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/run/clientGameTest/logs/
          if-no-files-found: ignore
