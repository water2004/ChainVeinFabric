name: Test

on:
  push:
    branches:
      - master
      - "1.21.1"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Minecraft 1.21.1 build and server tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build, unit tests, and standalone server GameTests
        run: |
          chmod +x ./gradlew
          ./gradlew clean build runGameTest --no-daemon

      # Minecraft 1.21.1 predates Fabric's client GameTest API. The upstream
      # client suites remain in src/gametest; local joint client validation and
      # optional Quick Shulker direct/legacy commands are in BACKPORT_1.21.1.md.

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/run/gameTest/logs/
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
